<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عيني - وصف صوتي</title>
<style>
  /* تصميم عالي التباين: خلفية سوداء وأزرار صفراء كبيرة */
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #000; color: #fff; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  video { width: 100%; max-height: 35vh; object-fit: cover; background: #111; }
  #status { white-space: pre-line; padding: 12px; font-size: 1.3rem; text-align: center; min-height: 4.5rem; }
  button { border: 0; font-weight: bold; cursor: pointer; }
  #start { margin: auto; padding: 40px 60px; font-size: 2rem; background: #ffd400; color: #000; border-radius: 20px; }
  /* الزر الكبير يأخذ معظم الشاشة ليسهل الضغط عليه دون رؤية */
  #describe { flex: 1; margin: 8px; font-size: 2.6rem; background: #ffd400; color: #000; border-radius: 24px; }
  #repeat { margin: 0 8px 8px; padding: 22px; font-size: 1.6rem; background: #333; color: #fff; border-radius: 16px; }
  button:disabled { opacity: .5; }
  button:focus-visible { outline: 6px solid #00e5ff; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <video id="video" playsinline muted aria-hidden="true"></video>
  <!-- aria-live: قارئ الشاشة ينطق أي تغيير في هذا العنصر تلقائياً -->
  <div id="status" role="status" aria-live="polite">اضغط "ابدأ" لتشغيل التطبيق</div>
  <button id="start">ابدأ</button>
  <button id="describe" hidden disabled aria-label="صِف ما أمامي">صِف ما أمامي</button>
  <button id="repeat" hidden aria-label="أعد آخر وصف">أعد آخر وصف</button>

<!-- مكتبتان خفيفتان: TensorFlow.js ونموذج COCO-SSD (~5MB) -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>
<script>
const $ = id => document.getElementById(id);
const video = $('video'), statusEl = $('status');
const startBtn = $('start'), describeBtn = $('describe'), repeatBtn = $('repeat');
let model, busy = false, lastText = '';

/* قاموس ترجمة أسماء الأشياء الـ 80 التي يتعرف عليها النموذج */
const AR = {person:'شخص',bicycle:'دراجة',car:'سيارة',motorcycle:'دراجة نارية',airplane:'طائرة',bus:'حافلة',train:'قطار',truck:'شاحنة',boat:'قارب','traffic light':'إشارة مرور','fire hydrant':'صنبور إطفاء','stop sign':'علامة قف','parking meter':'عداد مواقف',bench:'مقعد طويل',bird:'طائر',cat:'قطة',dog:'كلب',horse:'حصان',sheep:'خروف',cow:'بقرة',elephant:'فيل',bear:'دب',zebra:'حمار وحشي',giraffe:'زرافة',backpack:'حقيبة ظهر',umbrella:'مظلة',handbag:'حقيبة يد',tie:'ربطة عنق',suitcase:'حقيبة سفر',frisbee:'قرص طائر',skis:'زلاجات',snowboard:'لوح تزلج على الثلج','sports ball':'كرة',kite:'طائرة ورقية','baseball bat':'مضرب','baseball glove':'قفاز',skateboard:'لوح تزلج',surfboard:'لوح أمواج','tennis racket':'مضرب تنس',bottle:'زجاجة','wine glass':'كأس',cup:'كوب',fork:'شوكة',knife:'سكين',spoon:'ملعقة',bowl:'وعاء',banana:'موزة',apple:'تفاحة',sandwich:'ساندويتش',orange:'برتقالة',broccoli:'بروكلي',carrot:'جزرة','hot dog':'هوت دوج',pizza:'بيتزا',donut:'دونات',cake:'كعكة',chair:'كرسي',couch:'أريكة','potted plant':'نبتة',bed:'سرير','dining table':'طاولة',toilet:'مرحاض',tv:'تلفاز',laptop:'حاسوب محمول',mouse:'فأرة حاسوب',remote:'جهاز تحكم',keyboard:'لوحة مفاتيح','cell phone':'هاتف',microwave:'ميكروويف',oven:'فرن',toaster:'محمصة',sink:'حوض',refrigerator:'ثلاجة',book:'كتاب',clock:'ساعة',vase:'مزهرية',scissors:'مقص','teddy bear':'دمية دب','hair drier':'مجفف شعر',toothbrush:'فرشاة أسنان'};

/* ---------- النطق بالعربية ---------- */
let arVoice = null;
function pickVoice() {
  const v = speechSynthesis.getVoices();
  arVoice = v.find(x => x.lang.replace('_', '-') === 'ar-EG')
         || v.find(x => x.lang.replace('_', '-') === 'ar-SA')
         || v.find(x => x.lang.toLowerCase().startsWith('ar')) || null;
}
speechSynthesis.onvoiceschanged = pickVoice; pickVoice();
function speak(text) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = arVoice ? arVoice.lang : 'ar-SA';
  if (arVoice) u.voice = arVoice;
  u.rate = 0.95;
  speechSynthesis.speak(u);
}
function say(text) { statusEl.textContent = text; speak(text); lastText = text; }

/* ---------- البدء ---------- */
startBtn.onclick = async () => {
  startBtn.hidden = true;
  try {
    say('جارٍ تشغيل الكاميرا');
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 320 } }, audio: false });
    video.srcObject = stream; await video.play();
    say('جارٍ تحميل النموذج');
    try { await tf.setBackend('webgl'); } catch (e) { await tf.setBackend('cpu'); }
    await tf.ready();
    model = await cocoSsd.load({ base: 'lite_mobilenet_v2' }); // الأخف
    statusEl.textContent = 'جارٍ تسخين النموذج';
    await model.detect(video, 5, 0.5); // أول استدعاء بطيء دائماً، فنجريه الآن مرة
    describeBtn.hidden = repeatBtn.hidden = false; describeBtn.disabled = false;
    say('التطبيق جاهز. اضغط الزر الكبير لوصف ما أمامك');
  } catch (e) {
    console.error(e);
    say('حدث خطأ. تأكد من السماح بالكاميرا وأعد تحميل الصفحة');
  }
};

/* ---------- الاكتشاف والوصف ---------- */
function place(box, W) {            // الموقع أفقياً
  const cx = box[0] + box[2] / 2;
  return cx < W / 3 ? 'على اليسار' : cx > 2 * W / 3 ? 'على اليمين' : 'في الأمام';
}
function dist(box, W, H) {          // المسافة التقريبية حسب حجم الصندوق
  const r = (box[2] * box[3]) / (W * H);
  return r > 0.35 ? 'قريب جداً' : r > 0.1 ? 'قريب' : 'بعيد';
}
describeBtn.onclick = async () => {
  if (busy) return;
  busy = true; describeBtn.disabled = true;
  try {
    const W = video.videoWidth, H = video.videoHeight;
    const t0 = performance.now();
    const found = (await model.detect(video, 5, 0.5))
      .filter(p => AR[p.class])
      .sort((a, b) => b.bbox[2] * b.bbox[3] - a.bbox[2] * a.bbox[3])  // الأكبر أولاً
      .slice(0, 5);
    if (!found.length) say('لا أرى أشياء واضحة. حرّك الكاميرا ببطء وحاول مجدداً');
    else say('أرى: ' + found.map(p => `${AR[p.class]} ${place(p.bbox, W)}، ${dist(p.bbox, W, H)}`).join('. '));
    statusEl.textContent += `\n(${Math.round(performance.now() - t0)} ms - ${tf.getBackend()})`;
  } catch (e) {
    console.error(e); say('حدث خطأ، حاول مرة أخرى');
  } finally { busy = false; describeBtn.disabled = false; }
};
repeatBtn.onclick = () => lastText && speak(lastText);
</script>
</body>
</html>
