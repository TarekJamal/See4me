<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عيني - وصف صوتي</title>
<style>
  /* تصميم عالي التباين: خلفية سوداء وأزرار صفراء كبيرة */
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #000; color: #fff; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  video { width: 100%; max-height: 35vh; object-fit: cover; background: #111; }
  #status { padding: 12px; font-size: 1.3rem; text-align: center; min-height: 4.5rem; }
  button { border: 0; font-weight: bold; cursor: pointer; }
  #start { margin: auto; padding: 40px 60px; font-size: 2rem; background: #ffd400; color: #000; border-radius: 20px; }
  /* الزر الكبير يأخذ معظم الشاشة ليسهل الضغط عليه دون رؤية */
  #describe { flex: 1; margin: 8px; font-size: 2.6rem; background: #ffd400; color: #000; border-radius: 24px; }
  #repeat { margin: 0 8px 8px; padding: 22px; font-size: 1.6rem; background: #333; color: #fff; border-radius: 16px; }
  button:disabled { opacity: .5; }
  button:focus-visible { outline: 6px solid #00e5ff; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <video id="video" playsinline muted aria-hidden="true"></video>
  <!-- aria-live: قارئ الشاشة ينطق أي تغيير في هذا العنصر تلقائياً -->
  <div id="status" role="status" aria-live="polite">اضغط "ابدأ" لتشغيل التطبيق</div>
  <button id="start">ابدأ</button>
  <button id="describe" hidden disabled aria-label="صِف ما أمامي">صِف ما أمامي</button>
  <button id="repeat" hidden aria-label="أعد آخر وصف">أعد آخر وصف</button>
  <canvas id="canvas" hidden></canvas>

<script type="module">
// نسخة خفيفة: نموذج وصف صغير (~150MB) بدل Florence-2 الثقيل
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1';
env.backends.onnx.wasm.numThreads = 1; // أقل استهلاكاً للذاكرة

const $ = id => document.getElementById(id);
const video = $('video'), statusEl = $('status'), canvas = $('canvas');
const startBtn = $('start'), describeBtn = $('describe'), repeatBtn = $('repeat');
let captioner, translator, busy = false, lastText = '';

/* ---------- النطق بالعربية ---------- */
let arVoice = null;
function pickVoice() {
  const v = speechSynthesis.getVoices();
  arVoice = v.find(x => x.lang.replace('_', '-') === 'ar-EG')
         || v.find(x => x.lang.replace('_', '-') === 'ar-SA')
         || v.find(x => x.lang.toLowerCase().startsWith('ar')) || null;
}
speechSynthesis.onvoiceschanged = pickVoice; pickVoice();
function speak(text) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = arVoice ? arVoice.lang : 'ar-SA';
  if (arVoice) u.voice = arVoice;
  u.rate = 0.95;
  speechSynthesis.speak(u);
}
function say(text) { statusEl.textContent = text; speak(text); lastText = text; }
const onProgress = p => { if (p.status === 'progress') statusEl.textContent = `جارٍ التحميل ${Math.round(p.progress)}%`; };

/* ---------- البدء ---------- */
startBtn.onclick = async () => {
  startBtn.hidden = true;
  try {
    say('جارٍ تشغيل الكاميرا');
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 640 } }, audio: false });
    video.srcObject = stream; await video.play();

    say('جارٍ تحميل نموذج الوصف، يرجى الانتظار');
    captioner = await pipeline('image-to-text', 'Xenova/vit-gpt2-image-captioning', { progress_callback: onProgress });

    // الترجمة تُحمَّل بعد ذلك (وليس معه) لتخفيف الذاكرة؛ إن فشلت نكمل بالإنجليزية
    say('جارٍ تحميل المترجم');
    try { translator = await pipeline('translation', 'Xenova/opus-mt-en-ar', { progress_callback: onProgress }); }
    catch (e) { console.warn('لا يوجد مترجم', e); }

    describeBtn.hidden = repeatBtn.hidden = false; describeBtn.disabled = false;
    say('التطبيق جاهز. اضغط الزر الكبير لوصف ما أمامك');
  } catch (e) {
    console.error(e);
    say('حدث خطأ. أغلق التطبيقات الأخرى وأعد تحميل الصفحة');
  }
};

/* ---------- التقاط الصورة ووصفها ---------- */
describeBtn.onclick = async () => {
  if (busy) return;
  busy = true; describeBtn.disabled = true;
  let url;
  try {
    speak('جارٍ التحليل');
    // تصغير الصورة إلى 384 بكسل (حجم مدخل النموذج) لتوفير الذاكرة
    canvas.width = canvas.height = 384;
    canvas.getContext('2d').drawImage(video, 0, 0, 384, 384);
    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.8));
    url = URL.createObjectURL(blob);

    const english = (await captioner(url, { max_new_tokens: 30 }))[0].generated_text;
    let arabic = english;
    if (translator) arabic = (await translator(english, { max_new_tokens: 60 }))[0].translation_text;
    say(arabic);
    console.log('EN:', english, '| AR:', arabic);
  } catch (e) {
    console.error(e); say('حدث خطأ، حاول مرة أخرى');
  } finally { if (url) URL.revokeObjectURL(url); busy = false; describeBtn.disabled = false; }
};
repeatBtn.onclick = () => lastText && speak(lastText);
</script>
</body>
</html>
